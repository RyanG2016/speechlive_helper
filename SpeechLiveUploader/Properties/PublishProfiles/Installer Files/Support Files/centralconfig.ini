;Sample Central Configuration File
;This file should be placed on a network share accessible to all workstations
;or locally at C:\ProgramData\SpeechLive Helper\centralconfig.ini for single-machine deployments

[Config]
;REQUIRED: Encrypted Philips SpeechLive API bearer token
;Use the ApiKeyEncryptor tool to encrypt your API key before adding it here
API_Bearer=<encrypted_api_token_here>

;REQUIRED: SpeechLive API base URL
API_Tenant=https://sl-api-gateway-apim-prod-cae.azure-api.net

;REQUIRED: User-Agent string sent with API requests
API_UserAgent=SpeechLive Helper

;OPTIONAL: Vitalytics remote monitoring settings
;Only required if Vitalytics_Enabled=true in localconfig.ini
;Vitalytics_ApiKey=<encrypted_vitalytics_api_key>
;Vitalytics_ApiBaseUrl=https://api.vitalytics.app/api/v1

[Users]
;Author-to-SpeechLive user mapping
;Format: AuthorID=SpeechLiveUserID
;
;AuthorID = The numeric author ID configured on the recording device
;SpeechLiveUserID = The user's SpeechLive account identifier (email or GUID from SpeechLive admin portal)
;
;The sample DS2 file provided for testing uses AuthorID 7777
7777=<speechlive_author_email>
