;Sample Local Configuration File
;Copy this file to C:\ProgramData\SpeechLive Helper\localconfig.ini

[Config]
;REQUIRED: Path to the central configuration file
;Can be a UNC path (\\server\share\centralconfig.ini) or local path
Central_Config_UNC=\\server\share\centralconfig.ini

;REQUIRED: Unique identifier for this workstation
;Used in logs and filenames to identify the source machine
APP_Identifier=YOUR-WORKSTATION-ID

;OPTIONAL: Specific drive letter to monitor (e.g., E)
;Set to "none" to auto-detect USB devices (recommended)
Drive_Letter_To_Monitor=none

;REQUIRED: Whether to delete files from USB after successful upload
;Values: true or false
Delete_Files_After_Upload=true

;OPTIONAL: Enable remote monitoring via Vitalytics
;Values: true or false (default: false)
Vitalytics_Enabled=false

;OPTIONAL: Vitalytics environment mode
;Values: test or prod (default: prod)
Vitalytics_DataMode=prod

;OPTIONAL: Number of days to retain archived log files
;Default: 30
Log_Retention_Days=30

;OPTIONAL: Fallback author name when file's embedded author is not found in user mappings
;Leave empty to disable fallback behavior
DEFAULT_AUTHOR_ID=

;OPTIONAL: If true, always use DEFAULT_AUTHOR_ID regardless of file's embedded author
;Values: true or false (default: false)
ALWAYS_FALLBACK_TO_DEFAULT_AUTHORID=false

;OPTIONAL: Static worktype to send to API (overrides extracted worktype)
;This addresses Philips API requiring valid worktypes
;Default: Office Visit
STATIC_WORKTYPE=Office Visit

;OPTIONAL: Whether to use static worktype instead of extracted worktype
;Values: true or false (default: true)
USE_STATIC_WORKTYPE=true
